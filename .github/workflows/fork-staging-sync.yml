name: Fork staging sync

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC/GMT; avoid top-of-hour load; starts remain best-effort.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional full main SHA: verify this exact revision without merging newer upstream"
        required: false
        type: string

concurrency:
  group: fork-staging-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'palinalif/Marinara-Engine'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TARGET_BRANCH: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned revision or merge upstream without overwriting fork work
        id: merge
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$EXPECTED_SHA" ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ $(git rev-parse HEAD) == "$EXPECTED_SHA" ]] || {
              echo 'main moved since the requested validation SHA' >&2
              exit 1
            }
            echo "Validating pinned main revision $EXPECTED_SHA; skipping upstream merge"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Pasta-Devs/Marinara-Engine.git
          git fetch --no-tags upstream staging
          fork_sha=$(git rev-parse HEAD)
          upstream_sha=$(git rev-parse upstream/staging)
          if ! git merge --no-edit upstream/staging; then
            if [[ -n $(git ls-files -u) ]]; then
              mkdir -p sync-conflict
              printf '%s\n' "$fork_sha" > sync-conflict/fork.txt
              printf '%s\n' "$upstream_sha" > sync-conflict/upstream.txt
              printf '%s\n' "$GITHUB_RUN_ATTEMPT" > sync-conflict/attempt.txt
              git diff --name-only --diff-filter=U > sync-conflict/conflicts.txt
              echo 'conflict=true' >> "$GITHUB_OUTPUT"
            fi
            exit 1
          fi

      - name: Publish merge-conflict evidence for local review
        if: failure() && steps.merge.outputs.conflict == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-sync-conflict
          path: sync-conflict/
          if-no-files-found: error
          retention-days: 14

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Run focused server regressions
        shell: bash
        run: |
          set -euo pipefail
          for filter in active-character-reference character-id-macro-modes custom-voice tts; do
            node scripts/run-regressions.mjs --filter "$filter"
          done
          bash scripts/regressions/fork-sync-conflict-review.regression.sh
          bash scripts/regressions/fork-sync-pinned-main.regression.sh
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke and fork browser regressions
        shell: bash
        run: |
          set -euo pipefail
          pnpm smoke:ui
          pnpm exec playwright test e2e/narrator-macro-avatars.e2e.ts e2e/custom-voices.e2e.ts e2e/tts-card-connections.e2e.ts --project=desktop-chromium --project=mobile-chromium --workers=1

      - name: Push only the tested commit (never force)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Credentials are supplied only here, not persisted for install/tests.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$TARGET_BRANCH"
          mkdir -p sync-result
          git rev-parse HEAD > sync-result/commit.txt
          echo "Validated and pushed $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish tested SHA for the local build watcher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-sync-result
          path: sync-result/commit.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-sync-browser-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
